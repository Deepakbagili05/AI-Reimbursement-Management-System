<!DOCTYPE html>

<html>

<head>

<title>Submit Reimbursement</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f7fb;
    padding:40px;
}

.container{
    max-width:800px;
    margin:auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 25px rgba(0,0,0,0.1);
}

h1{
    color:#1a73e8;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:500;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

textarea{
    resize:none;
}

.btn{
    border:none;
    padding:12px 20px;
    border-radius:10px;
    color:white;
    cursor:pointer;
    margin-top:15px;
    font-size:15px;
}

.summary-btn{
    background:#fbbc04;
}

.submit-btn{
    background:#1a73e8;
}

.summary-btn:hover{
    background:#e0a800;
}

.submit-btn:hover{
    background:#1558b0;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Submit Reimbursement</h1>

<label>
Expense Amount
</label>

<input
type="number"
id="amount"
placeholder="Enter Amount">

<label>
Category
</label>

<select id="category">

<option value="Travel">
Travel
</option>

<option value="Food">
Food
</option>

<option value="Fuel">
Fuel
</option>

<option value="Accommodation">
Accommodation
</option>

<option value="Office Supplies">
Office Supplies
</option>

</select>

<label>
Description
</label>

<textarea
id="description"
rows="4"
placeholder="Enter Description">
</textarea>

<label>
Upload Bill
</label>

<input
type="file"
id="bill"
accept=".jpg,.jpeg,.png,.pdf">

<button
class="btn summary-btn"
onclick="generateSummary()">
Generate AI Summary </button>

<label>
AI Summary
</label>

<textarea
id="summary"
rows="8"
placeholder="Generated AI Summary">
</textarea>

<button
class="btn submit-btn"
onclick="submitReimbursement()">
Submit Reimbursement </button>

</div>

</div>

<script>

async function generateSummary(){

    const response =
    await fetch(
    "http://127.0.0.1:5000/summary",
    {
        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            amount:
            document.getElementById("amount").value,

            category:
            document.getElementById("category").value,

            description:
            document.getElementById("description").value
        })
    });

    const data =
    await response.json();

    document.getElementById(
    "summary"
    ).value =
    data.summary;
}

async function submitReimbursement(){


const formData =
new FormData();

formData.append(
    "user_id",
    localStorage.getItem(
        "user_id"
    )
);

formData.append(
    "expense_amount",
    document.getElementById(
    "amount").value
);

formData.append(
    "category",
    document.getElementById(
    "category").value
);

formData.append(
    "description",
    document.getElementById(
    "description").value
);

const billFile =
document.getElementById(
"bill").files[0];

if(billFile){

    formData.append(
        "bill",
        billFile
    );
}

const response =
await fetch(
"http://127.0.0.1:5000/submit",
{
    method:"POST",
    body:formData
});

const data =
await response.json();

alert(data.message);


}


</script>

</body>

</html>
